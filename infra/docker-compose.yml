x-common-healthcheck: &default-healthcheck
  interval: 5s
  timeout: 5s
  retries: 12

x-low-resource: &low-resource
  mem_swappiness: 0

services:
  postgres:
    image: postgres:17-alpine
    container_name: postgres
    cpus: 1.00
    mem_limit: 512m
    mem_reservation: 384m
    memswap_limit: 512m
    <<: *low-resource
    environment:
      - POSTGRES_PASSWORD=mysecretpassword
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.max=10000
      - -c
      - track_io_timing=on
      - -c
      - log_lock_waits=on
      - -c
      - deadlock_timeout=1s
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: pg_isready -U postgres || exit 1
      <<: *default-healthcheck

  postgres-statements-init:
    image: postgres:17-alpine
    container_name: postgres-statements-init
    environment:
      - PGPASSWORD=mysecretpassword
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        set -e
        psql -h postgres -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS pg_stat_statements;"
        psql -h postgres -U postgres -d postgres -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET pg_stat_statements.track = 'none';"
        psql -h postgres -U postgres -d postgres -v ON_ERROR_STOP=1 -c "SELECT pg_reload_conf();"

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    hostname: kafka
    container_name: kafka
    cpus: 1.00
    mem_limit: 2048m
    mem_reservation: 1536m
    memswap_limit: 2048m
    <<: *low-resource
    ports:
      - "9092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: CONTAINER_INTERNAL://${KAFKA_BOOTSTRAP_SERVERS},HOST://0.0.0.0:29092,CONTROLLER://kafka:9093
      KAFKA_ADVERTISED_LISTENERS: CONTAINER_INTERNAL://${KAFKA_BOOTSTRAP_SERVERS},HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTAINER_INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: CONTAINER_INTERNAL
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_LOG_RETENTION_MS: 600000
      KAFKA_LOG_RETENTION_BYTES: 268435456
      KAFKA_LOG_SEGMENT_BYTES: 33554432
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 30000
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: nc -z kafka ${KAFKA_PORT} || exit 1
      <<: *default-healthcheck

  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - bash
      - -c
      - |
        set -euo pipefail

        ensure_topic() {
          local topic="$1"
          local partitions="$2"

          kafka-topics --bootstrap-server ${KAFKA_BOOTSTRAP_SERVERS} --create --if-not-exists --topic "$$topic" --partitions "$$partitions" --replication-factor 1

          local current_partitions
          current_partitions="$$(kafka-topics --bootstrap-server ${KAFKA_BOOTSTRAP_SERVERS} --describe --topic "$$topic" | awk -F'PartitionCount: ' '/PartitionCount:/ { split($$2, parts, " "); print parts[1]; exit }')"
          if (( current_partitions < partitions )); then
            kafka-topics --bootstrap-server ${KAFKA_BOOTSTRAP_SERVERS} --alter --topic "$$topic" --partitions "$$partitions"
          fi
        }

        ensure_topic spi-payment-requests 8
        ensure_topic spi-payment-requests.dlq 8
        ensure_topic spi-payment-status-reports 8
        ensure_topic spi-payment-status-reports.dlq 8
        ensure_topic psp-notifications 8

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    profiles:
      - kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: kraft-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
    depends_on:
      kafka:
        condition: service_healthy

  certs-init:
    build:
      context: ./certs
      dockerfile: Dockerfile
    container_name: certs-init
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    volumes:
      - ./certs:/certs
    command:
      - init

  notification-gateway:
    build:
      context: ../notification-gateway
      dockerfile: Dockerfile
    container_name: notification-gateway
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    cpus: 1.00
    mem_limit: 512m
    mem_reservation: 320m
    memswap_limit: 512m
    <<: *low-resource
    ports:
      - "9090:9090"
    volumes:
      - ./certs/local/notification-gateway:/certs/gateway:ro
      - ./certs/local/ca:/certs/ca:ro
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/postgres
      GRPC_SERVER_SECURITY_CERTIFICATE_CHAIN: file:/certs/gateway/server.crt
      GRPC_SERVER_SECURITY_PRIVATE_KEY: file:/certs/gateway/server.key
      GRPC_SERVER_SECURITY_TRUST_CERT_COLLECTION: file:/certs/ca/ca.crt
      LOGGING_LEVEL_BR_KAUAN_NOTIFICATIONGATEWAY: ${LOGGING_LEVEL_BR_KAUAN_NOTIFICATIONGATEWAY:-INFO}
      NOTIFICATION_GATEWAY_KAFKA_LISTENER_CONCURRENCY: ${NOTIFICATION_GATEWAY_KAFKA_LISTENER_CONCURRENCY:-1}
      NOTIFICATION_GATEWAY_RECONCILIATION_BATCH_SIZE: ${NOTIFICATION_GATEWAY_RECONCILIATION_BATCH_SIZE:-1000}
      NOTIFICATION_GATEWAY_RECONCILIATION_FIXED_DELAY: ${NOTIFICATION_GATEWAY_RECONCILIATION_FIXED_DELAY:-1m}
      NOTIFICATION_GATEWAY_CURSOR_HMAC_SECRET: ${NOTIFICATION_GATEWAY_CURSOR_HMAC_SECRET:-local-development-cursor-secret-change-me}
      NOTIFICATION_GATEWAY_PULL_LONG_POLL_TIMEOUT_MS: ${NOTIFICATION_GATEWAY_PULL_LONG_POLL_TIMEOUT_MS:-30000}
      JAVA_TOOL_OPTIONS: "-Xms160m -Xmx256m -XX:MaxDirectMemorySize=96m -Xss256k"
    depends_on:
      certs-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  dict:
    build:
      context: ../dict
      dockerfile: Dockerfile
    container_name: dict
    profiles:
      - dict
    ports:
      - "8003:8003"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/postgres
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m -XX:MaxRAMPercentage=75"
    depends_on:
      postgres:
        condition: service_healthy

  spi:
    build:
      context: ../spi
      dockerfile: Dockerfile
    container_name: spi
    cpus: 1.00
    mem_limit: 768m
    mem_reservation: 512m
    memswap_limit: 768m
    mem_swappiness: 0
    ports:
      - "8002:8002"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/postgres
      SPI_KAFKA_FORCE_UNKNOWN_PROCESSING_ERROR: ${SPI_KAFKA_FORCE_UNKNOWN_PROCESSING_ERROR:-false}
      SPI_KAFKA_PAYMENT_REQUEST_LISTENER_CONCURRENCY: 1
      SPI_KAFKA_STATUS_REPORT_LISTENER_CONCURRENCY: 1
      SPI_KAFKA_PAYMENT_REQUEST_MAX_POLL_RECORDS: 500
      SPI_KAFKA_PAYMENT_REQUEST_FETCH_MIN_BYTES: 57344
      SPI_KAFKA_PAYMENT_REQUEST_FETCH_MAX_WAIT_MS: 100
      SPI_KAFKA_STATUS_REPORT_MAX_POLL_RECORDS: 500
      SPI_KAFKA_STATUS_REPORT_FETCH_MIN_BYTES: 16384
      SPI_KAFKA_STATUS_REPORT_FETCH_MAX_WAIT_MS: 125
      JAVA_TOOL_OPTIONS: "-Xms384m -Xmx512m"
      SPI_TRACE_FILE: /tmp/spi-trace.csv
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      postgres-statements-init:
        condition: service_completed_successfully

  kafka-producer:
    build:
      context: ../kafka-producer
      dockerfile: Dockerfile
    container_name: kafka-producer
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    cpus: 1.00
    mem_limit: 384m
    mem_reservation: 256m
    memswap_limit: 384m
    <<: *low-resource
    ports:
      - "8001:8001"
    volumes:
      - ./certs/local/kafka-producer:/certs/kafka-producer:ro
      - ./certs/local/ca:/certs/ca:ro
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_PRODUCER_TLS_CERTIFICATE_CHAIN: /certs/kafka-producer/server.crt
      KAFKA_PRODUCER_TLS_PRIVATE_KEY: /certs/kafka-producer/server.key
      KAFKA_PRODUCER_TLS_TRUST_CERT_COLLECTION: /certs/ca/ca.crt
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m -XX:MaxRAMPercentage=75 -Dreactor.netty.ioWorkerCount=1"
    depends_on:
      certs-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
