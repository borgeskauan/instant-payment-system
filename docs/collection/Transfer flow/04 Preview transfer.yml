info:
  name: 04 Preview transfer
  type: http
  seq: 1

http:
  method: post
  url: "{{senderPspUrl}}/transfer/preview"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "receiverPixKey": "{{receiverPixKey}}"
      }
  auth: inherit

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
