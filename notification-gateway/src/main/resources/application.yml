spring:
  application:
    name: notification-gateway

  main:
    web-application-type: none   # gRPC server only — no HTTP servlet container

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification-gateway-group
      auto-offset-reset: earliest

grpc:
  server:
    port: 9090
    security:
      enabled: true
      certificate-chain: file:/certs/gateway/server.crt
      private-key: file:/certs/gateway/server.key
      trust-cert-collection: file:/certs/ca/ca.crt
      client-auth: REQUIRE

notification-gateway:
  kafka:
    listener-concurrency: 1
    recent-window-capacity-per-partition: 4096
  pull:
    cursor-secret: local-development-cursor-secret-change-me
    long-poll-timeout: 30s
    kafka-scan-limit: 4096
    kafka-poll-timeout: 100ms
