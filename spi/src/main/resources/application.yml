spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: spi_flyway_schema_history
    validate-on-migrate: true

  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: mysecretpassword
    hikari:
      connection-timeout: 3000
      validation-timeout: 1000

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
    listener:
      auto-startup: false
  jmx:
    enabled: false
  main:
    lazy-initialization: false
    web-application-type: reactive

spi:
  kafka:
    payment-request-listener-concurrency: 1
    status-report-listener-concurrency: 3
    payment-request-group-id: spi-payment-request-consumer-group
    status-report-group-id: spi-status-report-consumer-group
    payment-request:
      max-poll-records: 500
      fetch-min-bytes: 57344
      fetch-max-wait-ms: 100
    status-report:
      max-poll-records: 500
      fetch-min-bytes: 16384
      fetch-max-wait-ms: 125
  notification-outbox:
    queue-capacity: 1024
    recovery-batch-size: 256
    retry-delay: 100ms

server:
  port: 8002
