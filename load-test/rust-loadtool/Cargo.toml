[package]
name = "rust-loadtool"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
autobins = false

[[bin]]
name = "rust-loadtool"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
hdrhistogram = "7.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1.47", features = ["sync"] }

[dev-dependencies]
tempfile = "3.20"
