[package]
name = "loadtool-generator"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

[dependencies]
anyhow = "1.0"
bytes = "1.10"
csv = "1.3"
hdrhistogram = "7.5"
http-body-util = "0.1"
hyper = { version = "1.6", features = ["client", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
libc = "0.2"
loadtool-contract = { path = "../loadtool-contract" }
prost = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1.47", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-util = { version = "0.7", features = ["rt"] }
tonic = { version = "0.12", features = ["tls", "transport"] }

[build-dependencies]
tonic-build = "0.12"
